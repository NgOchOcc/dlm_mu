# RWKU forget probe, level 2 (question answering). RougeL recall; lower better.
RWKU_forget_level2:
  handler: QADataset
  args:
    hf_args:
      path: "jinzhuoran/RWKU"
      name: "forget_level2"
      split: "test"
    question_key: "query"
    answer_key: "answer"
    max_length: 512
    predict_with_generate: True

# RWKU forget training corpus: the original passages describing the target
# entities (train_original_passage). Whole-corpus unlearning — forgets all
# target subjects at once. Chunked into fixed-length windows by
# PretrainingDataset. For per-subject unlearning, pre-filter this HF config by
# `subject` into a local file and point hf_args at it.
RWKU_forget_train:
  handler: PretrainingDataset
  args:
    hf_args:
      path: "jinzhuoran/RWKU"
      name: "train_original_passage"
      split: "train"
    text_key: "text"
    max_length: 2048

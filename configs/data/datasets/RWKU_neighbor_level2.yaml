# RWKU neighbor probe, level 2 (question answering). Retain; higher better.
RWKU_neighbor_level2:
  handler: QADataset
  args:
    hf_args:
      path: "jinzhuoran/RWKU"
      name: "neighbor_level2"
      split: "test"
    question_key: "query"
    answer_key: "answer"
    max_length: 512
    predict_with_generate: True

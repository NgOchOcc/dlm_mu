# @package eval.muse_dlm.metrics.forget_verbmem_ROUGE
# DLM counterpart of muse_metrics/forget_verbmem_ROUGE: ROUGE against
# iterative-denoising continuations (rouge_diffusion) on the MUSE verbmem forget set.
defaults:
  - ../../data/datasets@datasets: MUSE_forget_verbmem
  - ../../collator@collators: DataCollatorForSupervisedDatasetwithIndex
  - ../../generation@generation_args: dlm_default

handler: rouge_diffusion
rouge_type: rougeL_f1
batch_size: ${eval.muse_dlm.batch_size}
scheduler_name: ${eval.muse_dlm.scheduler_name}
right_shift_logits: ${eval.muse_dlm.right_shift_logits}

datasets:
  MUSE_forget_verbmem:
    args:
      hf_args:
        path: muse-bench/MUSE-${eval.muse_dlm.data_split}
      predict_with_generate: True
collators:
  DataCollatorForSupervisedDataset:
    args:
      padding_side: right
generation_args:
  max_new_tokens: 128

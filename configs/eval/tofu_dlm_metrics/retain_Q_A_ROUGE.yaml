# @package eval.tofu_dlm.metrics.retain_Q_A_ROUGE
defaults:
  - ../../data/datasets@datasets: TOFU_QA_retain_eval
  - ../../collator@collators: DataCollatorForSupervisedDatasetwithIndex
  - ../../generation@generation_args: dlm_default

handler: rouge_diffusion
rouge_type: rougeL_recall
batch_size: ${eval.tofu_dlm.batch_size}
scheduler_name: ${eval.tofu_dlm.scheduler_name}
right_shift_logits: ${eval.tofu_dlm.right_shift_logits}

datasets:
  TOFU_QA_retain_eval:
    args:
      question_key: ${eval.tofu_dlm.question_key}
      predict_with_generate: True
collators:
  DataCollatorForSupervisedDataset:
    args:
      padding_side: right

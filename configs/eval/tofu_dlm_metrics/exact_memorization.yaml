# @package eval.tofu_dlm.metrics.exact_memorization
defaults:
  - ../../data/datasets@datasets: TOFU_QA_forget
  - ../../collator@collators: DataCollatorForSupervisedDatasetwithIndex

handler: exact_memorization_diffusion
batch_size: ${eval.tofu_dlm.batch_size}
right_shift_logits: ${eval.tofu_dlm.right_shift_logits}

datasets:
  TOFU_QA_forget:
    args:
      hf_args:
        name: ${eval.tofu_dlm.forget_split}_perturbed
      question_key: ${eval.tofu_dlm.question_key}

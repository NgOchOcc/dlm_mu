# @package eval.rwku_dlm
# NOTE: the line above is a package directive, not a comment.
#
# Masked-diffusion (Dream, LLaDA) evaluation for the RWKU knowledge-unlearning
# benchmark (jinzhuoran/RWKU). Mirrors the MDU reference (eval_rwku_dream.py):
#   forget_level1/2/3   RougeL recall on generations  (lower is better)
#   neighbor_level1/2    RougeL recall                 (higher is better, retain)
#   mmlu                 MMLU few-shot accuracy        (higher is better)
#   truthfulqa_mc1       TruthfulQA MC1 (lowest NLL)   (higher is better)
#   triviaqa_em          TriviaQA generation EM        (higher is better)
#
# Evaluated over the full RWKU test sets (all target/neighbor subjects). For
# Dream set right_shift_logits=True on the CLI.
defaults:
  - rwku_dlm_metrics:
    - forget_level1_ROUGE
    - forget_level2_ROUGE
    - forget_level3_ROUGE
    - neighbor_level1_ROUGE
    - neighbor_level2_ROUGE
    - mmlu
    # TruthfulQA and TriviaQA are disabled: MMLU alone stands in for general
    # utility here. Re-enable by uncommenting (their metric configs are kept).
    # - truthfulqa_mc1
    # - triviaqa_em

handler: RWKUEvaluator
output_dir: ${paths.output_dir}
metrics: {}
overwrite: false
# Evaluation runs one process on one GPU (the metrics do not shard across
# ranks), so a whole device is available for the batch. Lower via EVAL_BS if it
# does not fit.
batch_size: 16

# MMLU prompts are 5-shot and several times longer than the other probes, so
# they get a smaller batch of their own.
mmlu_batch_size: 8

# Per-entity evaluation. RWKU reports results per target entity (MDU averages
# over the first 10), so the forget_* and neighbor_* probes are filtered to a
# single `subject`. Leave null to score the full test sets instead. The utility
# metrics (mmlu / truthfulqa / triviaqa) are entity-independent and never
# filtered.
target_subject: null

# Diffusion-specific knobs consumed by the DLM metric handlers.
scheduler_name: LinearAlphaScheduler
right_shift_logits: False  # set True for Dream

# Utility subsampling, applied after the per-entity subject filter. MMLU is
# capped at 100 per entity, matching the reference. utility_max_samples only
# affects TruthfulQA/TriviaQA, which are disabled above -- it is kept so those
# metrics still resolve if re-enabled.
mmlu_max_samples: 100
utility_max_samples: null

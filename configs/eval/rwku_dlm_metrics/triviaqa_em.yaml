# @package eval.rwku_dlm.metrics.triviaqa_em
# RWKU utility: TriviaQA generation exact-match (substring; higher better).
defaults:
  - ../../data/datasets@datasets: RWKU_triviaqa
  - ../../generation@generation_args: dlm_rwku

handler: triviaqa_em_diffusion
batch_size: ${eval.rwku_dlm.batch_size}
scheduler_name: ${eval.rwku_dlm.scheduler_name}
right_shift_logits: ${eval.rwku_dlm.right_shift_logits}
max_samples: ${eval.rwku_dlm.utility_max_samples}

# RWKU's utility sets also carry a `subject` column, and the reference
# implementation scores them per target entity (eval_rwku_dream.py filters with
# `r.get("subject") in subjects`). Filtering here matches that and keeps the
# metric proportional to one entity instead of the whole corpus.
datasets:
  RWKU_triviaqa:
    args:
      hf_args:
        filter_column: subject
        filter_value: ${eval.rwku_dlm.target_subject}

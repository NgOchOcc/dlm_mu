# @package eval.rwku_dlm.metrics.forget_level3_ROUGE
# RWKU forget probe (level3); RougeL recall on generations, lower is better.
defaults:
  - ../../data/datasets@datasets: RWKU_forget_level3
  - ../../collator@collators: DataCollatorForSupervisedDatasetwithIndex
  - ../../generation@generation_args: dlm_rwku

handler: rouge_diffusion
rouge_type: rougeL_recall
batch_size: ${eval.rwku_dlm.batch_size}
scheduler_name: ${eval.rwku_dlm.scheduler_name}
right_shift_logits: ${eval.rwku_dlm.right_shift_logits}

collators:
  DataCollatorForSupervisedDataset:
    args:
      padding_side: right

# Restrict to one target entity when eval.rwku_dlm.target_subject is set.
datasets:
  RWKU_forget_level3:
    args:
      hf_args:
        filter_column: subject
        filter_value: ${eval.rwku_dlm.target_subject}

# @package _global_
# Masked-diffusion (LLaDA/Dream) *forget-only* unlearning on MUSE. Same as
# experiment/unlearn/muse/dlm.yaml but the retain dataset is dropped entirely
# (retain=null), matching the RWKU/GAP forget-only precedent. With no retain
# batch, DiffusionUnlearnTrainer.optional_retain_loss returns 0.0, so the alpha
# term vanishes for GD/NPO/SimNPO/WGA and GA is unchanged. Dropping
# the retain stream also halves activation memory (no retain forward/backward),
# which is what lets LLaDA-8B fit at seq 2048.
defaults:
  - override /model: LLaDA-8B-Instruct
  - override /trainer: DiffusionGD
  - override /data: unlearn
  - override /data/datasets@data.forget: MUSE_forget
  - override /data/datasets@data.retain: null
  - override /eval: muse_dlm

data_split: News
forget_split: forget
retain_logs_path: null

# Dream needs right-shifted logits and the CART loss weighting; LLaDA does not.
# The runner passes these on the CLI per model.

data:
  anchor: forget
  forget:
    MUSE_forget:
      args:
        hf_args:
          split: ${forget_split}
          path: muse-bench/MUSE-${data_split}

eval:
  muse_dlm:
    data_split: ${data_split}
    retain_logs_path: ${retain_logs_path}
    overwrite: true

trainer:
  args:
    warmup_epochs: 1.0
    learning_rate: 1e-5
    weight_decay: 0.01
    num_train_epochs: 10
    lr_scheduler_type: constant

task_name: ???

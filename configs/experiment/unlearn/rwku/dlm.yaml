# @package _global_
# Masked-diffusion (LLaDA/Dream) unlearning on RWKU (jinzhuoran/RWKU).
#
# PER-ENTITY setting, matching the MDU reference (configs/mdu_rwku.yaml,
# run_main.sh `rwku_dream`): one unlearning run per target entity, results
# averaged over the first 10. RWKU's eval is itself per-subject — every forget /
# neighbor probe is filtered by `subject` — so a checkpoint that forgot all
# entities at once could not be scored the way RWKU reports results.
#
# RWKU is off-the-shelf: real-world entities are already in pretraining, so
# there is NO SFT stage. Unlearning starts from the base instruct model.
#
# It is also forget-only (no entity-level retain corpus), matching MDU's
# `--alpha 0.0 --no_retain`. Retain-based trainers (GD/NPO/SimNPO/WGA) run with
# the retain term disabled.
#
# The target entity MUST be supplied per run:
#   data.forget.RWKU_forget_pair.args.hf_args.filter_value="Stephen King" \
#   eval.rwku_dlm.target_subject="Stephen King"
defaults:
  - override /model: LLaDA-8B-Instruct
  - override /trainer: DiffusionGA
  - override /data: unlearn
  - override /data/datasets@data.forget: RWKU_forget_pair
  - override /data/datasets@data.retain: null
  - override /eval: rwku_dlm

# Dream: also set `override /model: Dream-v0-Instruct-7B` above and pass on CLI:
#   trainer.method_args.right_shift_logits: True
#   trainer.method_args.loss_weight_type: "cart[geo_p:0.3]"
#   eval.rwku_dlm.right_shift_logits: True

data:
  anchor: forget
  forget:
    RWKU_forget_pair: {}

eval:
  rwku_dlm:
    overwrite: true

# Matches MDU: EPO=3, LR=1e-5, per-device batch 4.
trainer:
  args:
    per_device_train_batch_size: 4
    warmup_epochs: 1.0
    learning_rate: 1e-5
    weight_decay: 0.01
    num_train_epochs: 3


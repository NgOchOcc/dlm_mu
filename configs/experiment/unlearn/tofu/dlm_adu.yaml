# @package _global_
# DiffusionADU on TOFU: selective anti-conditional KL combined with secret-free
# generative distillation. Retain-free and trained only on the forget split.
defaults:
  - override /model: LLaDA-8B-Instruct
  - override /trainer: DiffusionADU
  - override /data: unlearn
  - override /data/datasets@data.forget: TOFU_QA_forget
  - override /data/datasets@data.retain: null
  - override /eval: tofu_dlm

forget_split: forget10
retain_split: retain90
holdout_split: holdout10
question_key: "question"

# DiffusionADU uses answer-aligned logits, so right_shift_logits is unsupported.
# Use LLaDA rather than Dream for this method.

eval:
  tofu_dlm:
    forget_split: ${forget_split}
    holdout_split: ${holdout_split}
    overwrite: true
    question_key: ${question_key}

data:
  anchor: forget
  forget:
    TOFU_QA_forget:
      args:
        hf_args:
          name: ${forget_split}

trainer:
  args:
    warmup_epochs: 1.0
    learning_rate: 1e-5
    weight_decay: 0.01
    num_train_epochs: 9

task_name: ???

# @package _global_
# Masked-diffusion (LLaDA/Dream) SimpleTSD unlearning on TOFU
# (docs/simple_tsd_algorithms.tex). Retain-FREE and forget-set only: SimpleTSD
# scores each answer token by prompt-dependence (Alg. 1), demotes the gold token
# at the selected positions and self-distils the frozen teacher on the rest
# (Alg. 2), so it needs no retain set. The retain dataset is dropped entirely,
# matching the TSD / GAP / AURA forget-only precedent.
defaults:
  - override /model: LLaDA-8B-Instruct
  - override /trainer: DiffusionSimpleTSD
  - override /data: unlearn
  - override /data/datasets@data.forget: TOFU_QA_forget
  - override /data/datasets@data.retain: null
  - override /eval: tofu_dlm

forget_split: forget10
retain_split: retain90
holdout_split: holdout10
question_key: "question"

# Dream needs right-shifted logits and the CART loss weighting; LLaDA does not.
# For Dream, also set `override /model: Dream-v0-Instruct-7B` above and add:
#   trainer.method_args.right_shift_logits: True
#   trainer.method_args.loss_weight_type: "cart[geo_p:0.3]"
#   eval.tofu_dlm.right_shift_logits: True

eval:
  tofu_dlm:
    forget_split: ${forget_split}
    holdout_split: ${holdout_split}
    overwrite: true
    question_key: ${question_key}

data:
  anchor: forget
  forget:
    TOFU_QA_forget:
      args:
        hf_args:
          name: ${forget_split}

trainer:
  args:
    warmup_epochs: 1.0
    learning_rate: 1e-5
    weight_decay: 0.01
    num_train_epochs: 9

task_name: ???

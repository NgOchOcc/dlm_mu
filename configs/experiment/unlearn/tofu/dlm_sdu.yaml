# @package _global_
# Forget-only entity-counterfactual selective unlearning for masked-diffusion
# LMs on TOFU, where both the query-leak mask and the answer-fact mask come
# from an offline Monte Carlo occlusion cache (scripts/dlm/sdu_precompute.py)
# instead of the hand-written is_entity_surface heuristic. Identical to
# dlm_selective_unlearning.yaml otherwise; requires the index-emitting
# collator so DiffusionSDU can look each example up in the cache.
defaults:
  - override /model: LLaDA-8B-Instruct
  - override /trainer: DiffusionSDU
  - override /data: unlearn
  - override /data/datasets@data.forget: TOFU_QA_forget
  - override /data/datasets@data.retain: null
  - override /collator: DataCollatorForSupervisedDatasetwithIndex
  - override /eval: tofu_dlm

forget_split: forget10
retain_split: retain90
holdout_split: holdout10
question_key: "question"

eval:
  tofu_dlm:
    forget_split: ${forget_split}
    holdout_split: ${holdout_split}
    overwrite: true
    question_key: ${question_key}

data:
  anchor: forget
  forget:
    TOFU_QA_forget:
      args:
        hf_args:
          name: ${forget_split}

trainer:
  args:
    warmup_epochs: 1.0
    learning_rate: 1e-5
    weight_decay: 0.01
    num_train_epochs: 9

task_name: ???

# @package _global_
# Masked-diffusion (LLaDA/Dream) trajectory-aligned selective unlearning on TOFU
# (docs/traj_iproj_algorithms.tex). Same shape as experiment/unlearn/tofu/
# dlm_traj_rmdu.yaml -- forward KL to a frozen target at decoder-aligned states --
# but the target is the I-projection of the teacher under a belief-mass cap set by
# the runner-up token, so it moves the greedy argmax rather than only the mass.
defaults:
  - override /model: LLaDA-8B-Instruct
  - override /trainer: DiffusionTrajIProj
  - override /data: unlearn
  - override /data/datasets@data.forget: TOFU_QA_forget
  - override /data/datasets@data.retain: TOFU_QA_retain
  - override /eval: tofu_dlm

forget_split: forget10
retain_split: retain90
holdout_split: holdout10
question_key: "question"

eval:
  tofu_dlm:
    forget_split: ${forget_split}
    holdout_split: ${holdout_split}
    overwrite: true
    question_key: ${question_key}

data:
  anchor: forget
  forget:
    TOFU_QA_forget:
      args:
        hf_args:
          name: ${forget_split}
  retain:
    TOFU_QA_retain:
      args:
        hf_args:
          name: ${retain_split}

trainer:
  args:
    warmup_epochs: 1.0
    learning_rate: 1e-5
    weight_decay: 0.01
    num_train_epochs: 9

task_name: ???

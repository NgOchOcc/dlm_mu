# @package _global_
# Masked-diffusion (LLaDA/Dream) FCP-MDLM unlearning on TOFU.
# Like dlm.yaml but uses the DiffusionFCP primal-dual trainer and a collator
# that passes the per-example `index` through (used as the fact id for the
# per-fact dual multipliers and to look up cached caps).
defaults:
  - override /model: LLaDA-8B-Instruct
  - override /trainer: DiffusionFCP
  - override /data: unlearn
  - override /data/datasets@data.forget: TOFU_QA_forget
  - override /data/datasets@data.retain: TOFU_QA_retain
  - override /collator: DataCollatorForSupervisedDatasetwithIndex
  - override /eval: tofu_dlm

forget_split: forget10
retain_split: retain90
holdout_split: holdout10
question_key: "question"

# Dream needs right-shifted logits and the CART loss weighting; LLaDA does not.
# For Dream, also set `override /model: Dream-v0-Instruct-7B` above and add:
#   trainer.method_args.right_shift_logits: True
#   trainer.method_args.loss_weight_type: "cart[geo_p:0.3]"
#   eval.tofu_dlm.right_shift_logits: True
# The precompute cache MUST be built with the same right_shift_logits.

eval:
  tofu_dlm:
    forget_split: ${forget_split}
    holdout_split: ${holdout_split}
    overwrite: true
    question_key: ${question_key}

data:
  anchor: forget
  forget:
    TOFU_QA_forget:
      args:
        hf_args:
          name: ${forget_split}
  retain:
    TOFU_QA_retain:
      args:
        hf_args:
          name: ${retain_split}

trainer:
  args:
    warmup_epochs: 1.0
    learning_rate: 1e-5
    weight_decay: 0.01
    num_train_epochs: 10

task_name: ???

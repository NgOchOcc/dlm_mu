# @package _global_
# Masked-diffusion (LLaDA/Dream) RDU unlearning on TOFU. Port of MDU's
# repel_gendistill (recommended config). Retain-FREE, forget-set only: selects prompt-
# dependent answer tokens (PCSS, Alg. 1), GENERATES a secret-free answer with the frozen
# teacher from an identity-blanked query, distils the student toward it (loss_d) and repels
# the student soft-embedding off the gold secret on the selected positions (loss_f). The
# retain dataset is dropped entirely, matching other retain-free methods.
defaults:
  - override /model: LLaDA-8B-Instruct
  - override /trainer: DiffusionRDU
  - override /data: unlearn
  - override /data/datasets@data.forget: TOFU_QA_forget
  - override /data/datasets@data.retain: null
  - override /eval: tofu_dlm

forget_split: forget10
retain_split: retain90
holdout_split: holdout10
question_key: "question"

# Dream needs right-shifted logits and the CART loss weighting; LLaDA does not. NOTE:
# RDU reads hidden/logit spans aligned to the answer, so right_shift_logits
# is not supported -- use LLaDA (the default) for this method.

eval:
  tofu_dlm:
    forget_split: ${forget_split}
    holdout_split: ${holdout_split}
    overwrite: true
    question_key: ${question_key}

data:
  anchor: forget
  forget:
    TOFU_QA_forget:
      args:
        hf_args:
          name: ${forget_split}

trainer:
  args:
    warmup_epochs: 1.0
    learning_rate: 1e-5
    weight_decay: 0.01
    num_train_epochs: 9

task_name: ???

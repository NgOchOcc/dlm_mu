# Diffusion Language Model config (LLaDA-1.5).
# Loaded via model/dlm.py (dllm package), not the autoregressive AutoModelForCausalLM path.
model_type: dlm
model_args:
  pretrained_model_name_or_path: "GSAI-ML/LLaDA-1.5"
  torch_dtype: bfloat16
tokenizer_args:
  pretrained_model_name_or_path: "GSAI-ML/LLaDA-1.5"
template_args:
  apply_chat_template: True
  # No system prompt — matches the MDU benchmark (user-only chat template).
  system_prompt: null

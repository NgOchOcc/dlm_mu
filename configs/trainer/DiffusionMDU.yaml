defaults:
  - DiffusionGD

handler: DiffusionMDU
method_args:
  # tau multiplies the target logits: 1.0 is the unconditional prediction
  # itself, 0.0 is uniform. The paper sweeps {0, 0.25, 0.5, 0.75, 1.0}.
  tau: 0.5
  eta: 0.0
  kl_direction: forward
  alpha: 1.0
  gamma: 1.0
  retain_loss_type: NLL

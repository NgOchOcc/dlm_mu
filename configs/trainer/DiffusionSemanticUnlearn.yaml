defaults:
  - DiffusionFinetune

handler: DiffusionSemanticUnlearn
method_args:
  # Strength of semantic-neighbourhood suppression; eta=0 distils the teacher unchanged.
  eta: 1.0
  # Fixed RBF sigma used only if a vocabulary-wide median bandwidth degenerates.
  sigma_fallback: 0.05
  # Memory controls; neither changes the exact vocabulary-wide target.
  center_chunk_size: 8
  vocab_chunk_size: 4096

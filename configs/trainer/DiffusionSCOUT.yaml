defaults:
  - DiffusionFinetune

# SCOUT: Survival-Conditioned On-Policy Trajectory Unlearning
# (docs/scout_on_policy_trajectory_unlearning.tex, Algorithm 1). A single reverse
# path-space KL J = E_mu KL(P_theta || Q*_gamma) projects the model onto the
# survival-conditioned Doob target Q*_gamma ∝ P_0 * s_gamma(x, Z_0), with
# s_gamma = 1 - gamma * q_psi(C=F | x, y) from a provenance classifier. Optimized
# by the exact score-function gradient with a causal return-to-go
# G_t = c_0 + sum_{k<=t} c_k (c_t = log K_theta - log K_0, c_0 = -log s_hat) and
# an unbiased leave-one-out baseline over M trajectories per prompt. No separate
# forget/retain/timestep coefficients: the coefficient is fixed to one by the KL.
# Set right_shift_logits: True and loss_weight_type: "cart[geo_p:0.3]" for Dream.
handler: DiffusionSCOUT
method_args:
  num_transitions: 4          # T denoising transitions per rollout
  gen_length: 64              # answer positions generated on-policy
  temperature: 1.0            # on-policy sampling temperature (>0)
  num_trajectories: 2         # M trajectories per prompt (>=2 for the LOO baseline)
  gamma_start: 0.5            # initial deletion fraction (continuation start)
  gamma_final: 1.0            # final deletion fraction (1.0 = full deletion)
  survival_floor: 1e-3        # numerical floor eps_s on the survival estimate
  clf_lr: 1e-4                # provenance-classifier learning rate
  clf_hidden: 512             # provenance-classifier MLP hidden width
  leakage_ngrams: 2           # content n-gram order for the diagnostic recall (1 or 2)

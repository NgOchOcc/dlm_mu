defaults:
  - DiffusionFinetune

# OPTU: On-Policy Trajectory Unlearning (docs/on_policy_trajectory_unlearning_algorithms.tex).
# Constrained primal--dual actor--critic on full T-step denoising rollouts:
# minimize KL(Q_theta || Q_0) s.t. E[g_F] <= epsilon. Per-transition KL log-ratios
# vs a frozen reference, a content-n-gram leakage cost g_F, a value-head critic
# (own optimizer), a REINFORCE actor, and dual ascent on the leakage constraint.
# Set right_shift_logits: True and loss_weight_type: "cart[geo_p:0.3]" for Dream.
handler: DiffusionOPTU
method_args:
  num_transitions: 4     # T denoising transitions per rollout
  gen_length: 64         # answer positions generated on-policy
  temperature: 1.0       # on-policy sampling temperature (>0)
  epsilon: 0.1           # max admissible expected leakage
  eta_lambda: 0.05       # dual-ascent step size for lambda
  lambda_init: 0.0       # initial leakage dual
  value_lr: 1e-4         # critic learning rate (eta_psi)
  value_hidden: 512      # critic MLP hidden width
  leakage_ngrams: 2      # content n-gram order for g_F (1 or 2)
  forget_coef: 1.0       # weight on the forget actor term
  retain_coef: 1.0       # weight on the preservation actor term

defaults:
  - DiffusionGradDiff

handler: DiffusionTrajIProj
method_args:
  # -- where to act (Eq. 4) ---------------------------------------------------
  # Fraction of masked positions that get the erasure target, chosen per example
  # by gold residual. A fixed nat threshold is not comparable across state
  # sources (mean residual on decoder-aligned states is ~10x the forward-corrupted
  # one at matched mask rate), so the quantile fixes the count and lets the lift
  # decide only which positions. Sweep {0.15 0.3}; eta=1 is the soft-constraint
  # ablation (all masked positions active).
  eta: 0.3

  # -- what to forbid (Eq. 6) -------------------------------------------------
  # Teacher top-K slice the lift is evaluated on, the lift threshold in nats, and
  # the mass floor below which the lift is numerical noise (teacher entropy on a
  # memorised forget answer is ~1e-3 nats).
  top_k: 32
  delta_tok: 0.5
  prob_floor: 1e-4
  # Max ids per position from Spell(y). Measured on 30 TOFU names: mean 46,
  # p95 67, max 72 with the punctuation tier on (mean 12 / max 24 without), so 80
  # never truncates on this data.
  spell_max_ids: 80
  # Also admit a piece after dropping its leading punctuation, which is what
  # catches the measured " Yun" -> "-Y" reroute (0.59 of the displaced mass).
  # false = plain prefix matching, the ablation on string closure.
  spell_variants: true
  # Strip decoder-forbidden ids ([MASK], <|endoftext|>, ...) before any
  # normalization, so freed mass cannot be parked on tokens eval never emits.
  mask_special_tokens: true

  # -- how far to push (Eq. 9-11) ---------------------------------------------
  # Decision-margin cap: requires the leading forbidden token to fall below
  # kappa * q*(best allowed token), which is the only constraint the greedy eval
  # decoder can respond to. kappa=1 is the equality boundary -- the two tie and
  # index order decides the argmax -- so the default is strictly below it; sweep
  # {0.25 0.5 0.75}. margin_cap=false leaves the knowledge cap alone and is the
  # predicted no-op ablation (b(y)~0.999 needs c<=0.23 to move the argmax,
  # while the anchor mass is 0.4-0.5).
  kappa: 0.5
  margin_cap: true
  # Knowledge cap c_know = rho * a_know(B_i), with the anchor read at a null
  # prompt AND a fully masked answer so it cannot read the fact off the state.
  # cached: one forward per distinct padded shape (the doc's 3-forward step).
  # forward: recompute densely every step (exact-tail ablation). off: no cap.
  rho: 1.0
  knowledge_anchor: cached
  anchor_top_k: 64

  # -- objective (Eq. 13-16) --------------------------------------------------
  # Active and inactive masked positions carry separate normalizers, so sweeping
  # eta does not silently rescale the erasure signal. gamma is gamma_A.
  gamma: 1.0
  gamma_local: 1.0
  # forward: KL(p_theta || q*). kd: KL(q* || p_theta), mass-covering, predicted
  # to under-forget because it never penalizes keeping the gold token on top.
  kl_direction: forward
  # KL(p_0 || p_theta) on retain states. NLL is the ablation and is expected to
  # be inert: the finetuned checkpoint's retain NLL is already ~1e-4.
  retain_loss_type: KL
  alpha: 1.0

  # -- where the states come from (Alg 2) -------------------------------------
  # Mixture weights: teacher-forced decoder trajectory / detached rollout of the
  # current student / forward corruption for the remainder.
  lambda_traj: 0.5
  lambda_on: 0.0
  # 0 reveals one position per step, matching the eval decoder (steps > tokens).
  trajectory_steps: 0
  rollout_steps: 32
  rollout_temperature: 1.0
  # The teacher-forced reveal order is deterministic under the frozen model, so
  # it is cached across epochs; the on-policy rollout never is.
  cache_trajectories: true

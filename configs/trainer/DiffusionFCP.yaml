defaults:
  - DiffusionFinetune

# Fact-wise Counterfactual Projection (docs/FCP_MDLM_training_algorithm.tex).
# Online primal-dual (Algorithm 2): retain trust region KL(theta_0 || theta) +
# one-sided projection caps on each forget fact's monitored atoms, one dual
# multiplier per fact. Caps come from the offline precompute cache; set
# cache_path per run (see scripts/dlm/*/fcp.sh).
handler: DiffusionFCP
method_args:
  cache_path: ???
  delta: 0.03
  eta_lambda: 0.05
  lambda_init: 1.0
  feasibility_check_period: 0
  patience: 3
  strict_epsilon: null

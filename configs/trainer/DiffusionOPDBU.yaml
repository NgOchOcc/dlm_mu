defaults:
  - DiffusionFinetune

# OP-DBU: On-Policy Doob-Belief Unlearning (docs/op_dbu_algorithms_notation.tex,
# Algorithm 2 with the Rao--Blackwellized Forward Projection of Algorithm 3).
# A belief critic b_phi(x, y_t, t) is fit by BCE against a binary disclosure
# label; the closed-form tilt eta = logit p_k - logit eps_k defines the Doob
# desirability h = 1 - (1 - e^{-eta}) b_phi; the model is updated by a
# desirability-weighted MLE on its own denoising transitions. Retain behavior is
# preserved with a teacher-forced masked-diffusion NLL.
# Set right_shift_logits: True and loss_weight_type: "cart[geo_p:0.3]" for Dream.
handler: DiffusionOPDBU
method_args:
  num_transitions: 4          # T denoising transitions per rollout
  gen_length: 64              # answer positions generated on-policy
  temperature: 1.0            # on-policy sampling temperature (>0)
  eps_start: 0.8              # initial (loose) leakage budget
  eps_final: 0.1              # final (tight) leakage budget eps
  eta_max: 5.0                # clip on the proximal tilt eta_k (>=0)
  disclosure_threshold: 0.5   # recall above which a trajectory is labeled disclosing
  value_lr: 1e-4              # belief-critic learning rate
  value_hidden: 512           # belief-critic MLP hidden width
  leakage_ngrams: 2           # content n-gram order for the recall statistic (1 or 2)
  forget_coef: 1.0            # weight on the RB forward-projection (forget) term
  retain_coef: 1.0            # weight on the teacher-forced retain NLL term

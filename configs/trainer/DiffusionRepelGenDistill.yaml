# Repel + generative self-distillation (RepelGenDistill) for masked-diffusion unlearning.
# Port of MDU's sbru_forget_mode="repel_gendistill" -- recommended config only.
# Retain-FREE, forget-set only. Selects prompt-dependent answer tokens (PCSS, Alg. 1),
# GENERATES a secret-free answer with the frozen teacher (identity-blanked query), distils
# the student's whole answer span toward it (loss_d) and adds a bounded RBF soft-embedding
# repulsion off the gold secret on the selected forget positions (loss_f).
defaults:
  - DiffusionFinetune

handler: DiffusionRepelGenDistill
method_args:
  # repel_alpha: weight of the repulsion term in the per-example loss
  #   L = repel_alpha * L_repel + (1 - repel_alpha) * L_distill.
  # 0.5 balances repulsion (loss_f) and secret-free distillation (loss_d); 1.0 = pure
  # repel (no distillation), 0.0 = pure secret-free SFT.
  repel_alpha: 0.5

  # --- A_hat selection (PCSS, Alg. 1) ---
  # select_method: how A_hat is thresholded from the prompt-dependence scores s_i.
  #   topk (default) -- keep the top `topk_frac` of answer tokens by score. Rank-based, so
  #                     A_hat is never empty and stays stable even when scores are uniformly
  #                     high (matches the MDU ks_repel config; Otsu-pure left A_hat empty on
  #                     ~6/10 forget10 samples).
  #   otsu           -- adaptive per-example 2-class split; threshold-free.
  #   tau            -- fixed absolute threshold s_i >= tau.
  select_method: topk
  # topk_frac: fraction of answer tokens kept when select_method=topk.
  topk_frac: 0.8
  # otsu_relax: loosen the Otsu cut toward the low tail: thr' = thr - relax*(thr - min_s).
  # 0.0 = pure Otsu; higher forgets more. Used only when select_method=otsu.
  otsu_relax: 0.0
  # tau: absolute score threshold, used only when select_method=tau.
  tau: 0.0
  # sel_mc: partial-mask draws averaged per example when scoring s_i. More = steadier
  # selection but sel_mc teacher forward pairs per (uncached) selection.
  sel_mc: 16
  # drop_question_overlap: drop answer tokens that merely echo a question word (the
  # prompt already reveals that surface, so it is not a secret to forget).
  drop_question_overlap: true

  # --- secret-free generation (the frozen teacher writes the distillation target) ---
  # gen_steps: greedy confidence-topk denoise steps used to fill the answer.
  gen_steps: 128
  # keep_answer: false = generate the whole answer from scratch (mask the entire answer,
  # recommended -- deterministic, no dependence on A_hat's stochastic draws). true = keep
  # the fluent gold structure and only regenerate A_hat + entity names in the answer.
  keep_answer: false
  # query_blank_identity: blank proper-noun / date IDENTITY tokens in the query (not just
  # names shared with the answer) before generating, so the teacher cannot reconstruct the
  # true subject even from a pronoun/surname reference. Recommended anti-leak default.
  query_blank_identity: true
  # keep_subject_name: keep-answer only. Hide the subject name from the teacher's input
  # but restore the gold name afterwards, so the target keeps the CORRECT name for the
  # question while the secret facts stay forgotten.
  keep_subject_name: false

  # --- distillation (loss_d, over the whole answer span R) ---
  # distill_mode: sft (default) -- cross-entropy toward the generated secret-free answer.
  #               teacher       -- soft top-K distillation toward the frozen teacher at the
  #                                identity-blanked context (gold optionally suppressed).
  distill_mode: sft
  # distill_topk: number of teacher tokens kept for the soft target when distill_mode=teacher.
  distill_topk: 64
  # suppress_gold: set the gold token to -inf in the teacher anchor at A_hat positions, so
  # neither the soft-distill target nor the repulsion anchor can leak the secret back.
  suppress_gold: true
  # loss_d_ahat_weight: up-weight the (few) A_hat positions in loss_d, since the generated
  # answer differs from the gold only there. 1.0 = uniform over the answer span.
  loss_d_ahat_weight: 1.0

  # --- RBF repulsion (loss_f, on F = masked ∩ A_hat) ---
  #   kl_f = k(e_hat, gold_centre) - gamma_anc * k(e_hat, secret_free_anchor)  in [-gamma_anc, 1]
  # sigma: repulsion-kernel bandwidth. "median" = SVGD median heuristic (adaptive); a
  # float uses a fixed exp(-||.||^2 / 2 sigma^2).
  sigma: median
  # sigma_anc: fixed bandwidth of the attractive anchor kernel k(e_hat, anchor).
  sigma_anc: 1.0
  # sigma_fallback: bandwidth used when the median heuristic is degenerate (< 2 points).
  sigma_fallback: 0.05
  # gamma_anc: weight of the attractive anchor term relative to the repulsion.
  gamma_anc: 1.0

  # loss_mc: independent Monte-Carlo mask draws averaged into the loss per step (A_hat,
  # gen_ans and the teacher anchor are computed once and reused). Multi-draw training
  # back-propagates each draw immediately, so peak activation memory stays at one student
  # graph regardless of loss_mc.
  loss_mc: 1
  # gamma: overall scale on the RepelGenDistill forget loss.
  gamma: 1.0

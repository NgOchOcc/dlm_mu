defaults:
  - DiffusionGradDiff

handler: DiffusionAURA
method_args:
  # delta: association margin (nats). [a_i - delta]_+ only penalises prompt->
  # response association above the margin; delta=0 penalises any positive excess.
  delta: 0.0
  # lam: preservation weight (>= 0). L = L_erase + lam * L_preserve.
  lam: 1.0
  # l_max: maximum forget-key span length searched in Alg 1 (proposal: 4).
  l_max: 4
  # span_samples (R): forward-noised responses averaged when scoring A(s) (proposal: 4).
  span_samples: 4
  # max_candidates: cap on candidate spans per example (bounds the search cost).
  max_candidates: 64
  # num_on_policy (K): extra responses sampled from the current model per prompt;
  # the gold y is always included. 0 = gold-only (cheapest); proposal's minimal
  # setting is K=1. Raise only after the base objective is validated.
  num_on_policy: 0
  # on_policy_steps: reveal steps per on-policy sample (unused when K=0).
  on_policy_steps: 32
  rollout_temperature: 1.0
  # span_chunk_size: batch chunk for the teacher forwards during span search.
  span_chunk_size: 64
  cache_spans: true
  # alpha=0 makes AURA retain-free (preservation carries non-forget behaviour).
  # Set alpha>0 and supply a retain dataset only for the retain-NLL ablation.
  alpha: 0.0
  gamma: 1.0
  retain_loss_type: NLL

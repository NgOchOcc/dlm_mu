defaults:
  - DiffusionFinetune

# Adversarial Masked-Transition Unlearning (docs/AMTU_training_algorithm.tex).
# Anchor = frozen theta_0 with the prompt masked (null/unconditional);
# I_f = all answer tokens; faithful Algorithm 1 with small default budgets.
handler: DiffusionAMTU
# The adversarial mask search takes torch.autograd.grad w.r.t. input embeddings,
# which is incompatible with reentrant gradient checkpointing. Use non-reentrant
# checkpointing (memory savings preserved) whenever GC is enabled.
args:
  gradient_checkpointing_kwargs:
    use_reentrant: false
method_args:
  beta: 5.0
  lambda_retain: 1.0
  mask_fractions: [0.25, 0.5, 0.75]
  restarts: 1
  swap_steps: 2

# Concept-Subspace Demotion (CSD) for masked-diffusion LM unlearning
# (src/trainer/dlm/unlearn/concept_subspace.py). Inherits the SimpleTSD selection /
# masking / self-distillation pipeline, but at the selected forget positions A_hat the
# forget objective is replaced by a HIDDEN-STATE erasure: it removes the prompt-dependence
# direction g = h_teacher(x, y_M) - h_teacher(x_empty, y_M) from the student's hidden state,
# so all lexical realisations of the concept (which read out from that shared direction)
# collapse together -- instead of demoting the gold token in the output distribution, where
# mass merely re-flows to semantic neighbours. Inherits every method_args default from
# DiffusionSimpleTSD.
defaults:
  - DiffusionSimpleTSD

handler: DiffusionCSD
method_args:
  # erase_layer: which teacher/student hidden_states layer carries the concept direction.
  # -1 = post-final-LN state the unembedding reads (controls the output distribution most
  # directly).
  erase_layer: -1
  # subspace_rank: dimension of the per-example concept subspace to erase. Built by SVD over
  # prompt-dependence vectors g = h0 - h0_base collected across mask draws / forget
  # positions. 1 = the original rank-1 CSD (== SimpleTSDQMask promptless target); higher r
  # denoises the direction and spans what all lexical variants read from.
  subspace_rank: 8
  # subspace_mc: teacher Monte-Carlo mask draws used to collect g vectors for the subspace
  # (mirrors sel_mc). More draws -> a better-conditioned concept subspace.
  subspace_mc: 8
  # complement_weight: weight on the LEACE-style off-subspace preservation term
  # ||(I - P^T P)(h_s - h0)||^2 / d that pins every direction orthogonal to the concept
  # subspace to the with-question teacher (fluency / unrelated content). 0 disables it.
  complement_weight: 1.0
  # min_dir_norm: a real concept direction only exists where the question actually moves the
  # hidden state; g vectors with ||g|| below this are dropped before the SVD.
  min_dir_norm: 1.0e-3
  # mode: 'repr' erases at the representation level (implemented). 'dist' (project h0 off the
  # concept subspace and re-unembed) is future work -- the unembedding is ZeRO-3 sharded.
  mode: repr

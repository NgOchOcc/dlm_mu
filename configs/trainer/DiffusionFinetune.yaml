# Masked diffusion language modeling finetune trainer (Dream, LLaDA).
# DLM counterpart of trainer/finetune.yaml.
handler: DiffusionFinetuneTrainer
args:
  per_device_train_batch_size: 4
  per_device_eval_batch_size: 8
  gradient_accumulation_steps: 4
  learning_rate: 1e-5
  bf16: True
  bf16_full_eval: True
  logging_steps: 1
  output_dir: ${paths.output_dir}
  logging_dir: ${trainer.args.output_dir}/logs
  report_to: tensorboard
  ddp_find_unused_parameters: None
  gradient_checkpointing: False
  optim: adamw_torch
  save_strategy: 'no'
  save_only_model: True
  weight_decay: 0.00
  do_train: True
  do_eval: True
  eval_on_start: True
  eval_strategy: epoch
  num_train_epochs: 10
  seed: 0
  # DLM forward takes only input_ids/attention_mask; keep `labels` from being dropped.
  remove_unused_columns: False
method_args:
  # Set right_shift_logits: True and loss_weight_type: "cart[geo_p:0.3]" for Dream.
  scheduler_name: LinearAlphaScheduler
  time_epsilon: 1e-3
  loss_weight_type: scheduler
  loss_norm_type: token
  right_shift_logits: False
  # Teach the model to terminate inside the fixed generation block: supervise the
  # response region out to this many tokens (counted from the first answer token),
  # replacing the chat template's post-answer scaffold and any leftover positions
  # with EOS targets. Matches the eval generation max_new_tokens so the training
  # and inference response blocks are identical -- without this the model never
  # sees what should fill the tail of the block and fills it by repeating the
  # answer at decode time. Set to null to fall back to the legacy objective
  # (answer + trailing scaffold, no explicit termination signal).
  eos_pad_to: 128

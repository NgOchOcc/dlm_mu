defaults:
  - DiffusionGradDiff

handler: DiffusionGAP
method_args:
  # lam: maximum unlearning strength in [0, 1]. Proposal sweeps {0.25, 0.5, 0.75, 1.0}.
  lam: 1.0
  # epsilon: stabilises the log/normalisation; the proposal recommends 1e-8.
  epsilon: 1e-8
  # copy_ngram: an answer token inside a contiguous n-gram also present in the
  # prompt is copy-safe (kappa=0). 2 spares copied entities without sparing stopwords.
  copy_ngram: 2
  # alpha=0 makes GAP retain-free (the alpha=0 special case gives q*=p^c off-forget).
  # Set alpha>0 and supply a retain dataset only for the retain-NLL ablation.
  alpha: 0.0
  gamma: 1.0
  retain_loss_type: NLL

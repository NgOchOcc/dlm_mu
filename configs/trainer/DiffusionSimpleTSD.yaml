# Simple Trajectory-Selective Distillation (docs/simple_tsd_algorithms.tex).
# Retain-FREE, forget-set only. Scores prompt-dependent answer tokens under partial
# masking (PCSS, Alg. 1), demotes the gold token at the selected positions and
# self-distils the teacher on the rest (Alg. 2).
defaults:
  - DiffusionFinetune

handler: DiffusionSimpleTSD
method_args:
  # alpha: forget weight in L = alpha*L_forget + (1-alpha)*L_distill. alpha=0.5 is
  # the proposal default; alpha=1.0 drops self-distillation (pure demotion ablation).
  alpha: 0.5
  # select_method: how A_hat is thresholded from the prompt-dependence scores s_i.
  #   otsu (default) -- adaptive per-example 2-class split; threshold-free, robust to
  #                     s being almost always >= 0 (magnitude matters, not sign).
  #   topk           -- keep the top `topk_frac` of answer tokens by score.
  #   tau            -- fixed absolute threshold s_i >= tau (legacy).
  select_method: otsu
  # otsu_relax: loosen the Otsu cut toward the low tail so MORE answer tokens enter
  # A_hat: thr' = thr - otsu_relax * (thr - min_s). 0.0 = pure Otsu; higher forgets
  # more (0.5 selects roughly half the answer; ->1.0 selects nearly every token).
  otsu_relax: 0.5
  # sel_mc: partial-mask draws averaged per example when scoring s_i. More = steadier
  # selection but sel_mc teacher forwards per step (x2 for the promptless pass).
  sel_mc: 8
  # topk_frac: fraction of answer tokens kept when select_method=topk.
  topk_frac: 0.5
  # drop_question_overlap: subtract answer tokens that copy a token from the question
  # (the prompt already reveals that surface form, so it is not secret to forget).
  drop_question_overlap: true
  # tau: prompt-dependence threshold, used only when select_method=tau. Answer token
  # i is a forget token iff s_i >= tau.
  tau: 0.0
  # demotion: which teacher tokens to demote at each selected (F) position.
  #   minimal (default) -- remove only the gold token y_i, renormalise over the rest.
  #   belief            -- remove the teacher's top-K HIGHEST-PROBABILITY tokens (set
  #                        their mass to 0, renormalise); gold is not force-added, but
  #                        at a fact position it is the teacher's top prediction anyway.
  demotion: minimal
  # belief_top_k: number of highest-prob teacher tokens zeroed when demotion=belief.
  belief_top_k: 5
  # gamma: overall scale on the SimpleTSD loss.
  gamma: 1.0

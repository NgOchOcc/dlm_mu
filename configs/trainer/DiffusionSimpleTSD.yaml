# Simple Trajectory-Selective Distillation (docs/simple_tsd_algorithms.tex).
# Retain-FREE, forget-set only. Scores prompt-dependent answer tokens under partial
# masking (PCSS, Alg. 1), demotes the gold token at the selected positions and
# self-distils the teacher on the rest (Alg. 2).
defaults:
  - DiffusionFinetune

handler: DiffusionSimpleTSD
method_args:
  # alpha: forget weight in L = alpha*L_forget + (1-alpha)*L_distill. alpha=0.5 is
  # the proposal default; alpha=1.0 drops self-distillation (pure demotion ablation).
  alpha: 0.5
  # select_method: how A_hat is thresholded from the prompt-dependence scores s_i.
  #   otsu (default) -- adaptive per-example 2-class split; threshold-free, robust to
  #                     s being almost always >= 0 (magnitude matters, not sign).
  #   topk           -- keep the top `topk_frac` of answer tokens by score.
  #   tau            -- fixed absolute threshold s_i >= tau (legacy).
  select_method: otsu
  # otsu_relax: loosen the Otsu cut toward the low tail so MORE answer tokens enter
  # A_hat: thr' = thr - otsu_relax * (thr - min_s). 0.0 = pure Otsu; higher forgets
  # more (0.5 selects roughly half the answer; ->1.0 selects nearly every token).
  otsu_relax: 0.5
  # sel_mc: partial-mask draws averaged per example when scoring s_i. More = steadier
  # selection but sel_mc teacher forwards per step (x2 for the promptless pass).
  sel_mc: 8
  # loss_mc: independent Monte-Carlo mask draws averaged into the training loss per
  # example (the N in "sample N draws"). 1 = single pathwise draw; >1 lowers the
  # pathwise gradient variance at the cost of loss_mc extra student+teacher forwards
  # per step (A_hat is computed once and reused across the draws). Multi-draw training
  # back-propagates each draw immediately (see simple_tsd.py training_step), so peak
  # activation memory stays at one student graph regardless of loss_mc.
  loss_mc: 4
  # mask_mode: how each draw's loss mask is drawn.
  #   cover (default)      -- per draw pick t ~ U(eps,1) so a rho(t)=1-scheduler(t)
  #                           fraction of the answer is masked (ordinary MDLM masking),
  #                           then split retain_frac / (1-retain_frac) between the retain
  #                           set R and A_hat. Forget positions are drawn WEIGHTED by their
  #                           PCSS score (high prompt-dependence -> high mask probability);
  #                           >=1 forget position per draw. Coverage of A_hat is soft.
  #   stratified           -- k ~ Uniform{1..|A|} random answer positions (as DiffusionTSD),
  #                           forces >=1 A_hat position; no retain_frac split, no weighting.
  mask_mode: cover
  # retain_frac (= q): in mask_mode=cover, the retain SHARE of each draw's masked budget.
  # q of the masked tokens come from the retain set R = A \ A_hat, (1-q) from the forget
  # set A_hat. 0.0 = mask only forget positions; higher q = more self-distillation coverage.
  retain_frac: 0.5
  # select_temp: temperature for the score-weighted forget-position sampling in cover mode.
  # Scores are standardised within A_hat, then masked ~ softmax(score/select_temp). Lower =
  # sharper (top-scoring forget tokens masked almost every draw); higher -> uniform. Has no
  # effect on manual-span A_hat (no scores) or on stratified mode.
  select_temp: 1.0
  # topk_frac: fraction of answer tokens kept when select_method=topk.
  topk_frac: 0.5
  # drop_question_overlap: subtract answer tokens that copy a token from the question
  # (the prompt already reveals that surface form, so it is not secret to forget).
  drop_question_overlap: true
  # tau: prompt-dependence threshold, used only when select_method=tau. Answer token
  # i is a forget token iff s_i >= tau.
  tau: 0.0
  # demotion: which teacher tokens to demote at each selected (F) position.
  #   minimal (default) -- remove only the gold token y_i, renormalise over the rest.
  #   belief            -- remove the gold token AND the teacher's top-K HIGHEST-
  #                        PROBABILITY tokens (set their mass to 0, renormalise),
  #                        matching DiffusionTSD's belief demotion.
  demotion: minimal
  # belief_top_k: number of highest-prob teacher tokens zeroed when demotion=belief.
  belief_top_k: 5
  # mask_weight_power: emphasis on high-mask (few-revealed) draws. The per-example loss
  # is weighted by (masked answer fraction)^power. 0.0 = uniform (original). Higher (e.g.
  # 1.0-3.0) up-weights states where most of the answer is still masked -- the first
  # commitments a diffusion decoder makes, hence the states that must be content-free for
  # order-robust semantic erasure. Applies to both SimpleTSD and its subclasses.
  mask_weight_power: 0.0
  # gamma: overall scale on the SimpleTSD loss.
  gamma: 1.0
